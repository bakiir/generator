    <form action="/account/reg" method="post">

            <input type="tel" id="number" name="number" pattern="\+?[0-9]{10,15}" minlength="11" placeholder="+7 (__)___-__-__"
            maxlength="12" required>
        </div>
        
        <div>

            <input type="text" id="command" name="command" required>
        </div>
        
        <button type="submit">Қатысу</button>
    </form>
