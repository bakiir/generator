<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қатысу формасы</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 20px;
        }

        h2 {
            color: #ffee58;
            font-size: 25px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            font-size: 14px;
            color: #fff;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #ffee58;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #ffee58;
            color: #121212;
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e0d153;
        }

        .footer-text {
            font-size: 12px;
            color: #aaa;
            margin-top: 16px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .modal h3 {
            color: #ffee58;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .modal p {
            font-size: 18px;
            color: #fff;
            margin-bottom: 16px;
        }

        .modal button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #ffee58;
            color: #121212;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .modal button:hover {
            background-color: #e0d153;
        }

        #userNumber {
            font-size: 64px; /* Большой размер шрифта */
            color: #ffee58; /* Желтый цвет */
            font-weight: bold; /* Жирный шрифт */
            margin: 20px 0; /* Отступы сверху и снизу */
            display: block; /* Чтобы текст был на новой строке */
        }

        /* Предупредительное сообщение */
        .warning-text {
            font-size: 14px;
            color: #ff5555; /* Красный цвет для предупреждения */
            margin-top: 10px;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            h2 {
                font-size: 20px;
            }

            input {
                padding: 10px;
            }

            button {
                padding: 10px;
                font-size: 14px;
            }

            #userNumber {
                font-size: 50px; /* Уменьшаем размер на маленьких экранах */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Логотип -->
        <img src="../images/logo.svg" alt="Логотип компании" class="logo">
        <h2>Бақытты нөміріңізді алыңыз</h2>

        <!-- Форма -->
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Есіміңіз</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="number">Телефон номеріңіз</label>
                <input type="tel" id="number" name="number" required>
            </div>
            <div class="form-group">
                <label for="command">Команда аты</label>
                <input type="text" id="command" name="command" required>
            </div>
            <button type="submit">Тіркелу</button>
        </form>

        <!-- Текст внизу -->
        <p class="footer-text">Батырманы баса отырып, сіз өзіңіз жайлы ақпаратты өңдеуге рұқсат бересіз</p>
    </div>

    <!-- Модальное окно -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h3>Тіркеу сәтті!</h3>
            <p>Сіздің нөміріңіз:</p>
            <span id="userNumber"></span> <!-- Номер пользователя -->
            <p class="warning-text">Скрин жасауды ұмытпаңыз</p> <!-- Предупредительное сообщение -->
            <button onclick="closeModal()">Жабу</button>
        </div>
    </div>

    <script>
        // Обработка отправки формы
        document.getElementById('registrationForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Отменяем стандартную отправку формы

            // Собираем данные формы
            const formData = {
                name: document.getElementById('name').value,
                number: document.getElementById('number').value,
                command: document.getElementById('command').value,
            };

            try {
                // Отправляем данные на сервер
                const response = await fetch('/account/reg', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                // Обрабатываем ответ
                const result = await response.json();

                if (result.success) {
                    // Показываем модальное окно с номером
                    showModal(result.number);
                } else {
                    alert('Тіркеу сәтсіз аяқталды: ' + result.msg);
                }
            } catch (error) {
                console.error('Қате орын алды:', error);
                alert('Серверге қосылу мүмкін емес');
            }
        });

        // Функция для показа модального окна
        function showModal(number) {
            const modal = document.getElementById('successModal');
            const userNumber = document.getElementById('userNumber');
            userNumber.textContent = number; // Вставляем номер в модальное окно
            modal.style.display = 'flex'; // Показываем модальное окно
        }

        // Функция для закрытия модального окна
        function closeModal() {
            const modal = document.getElementById('successModal');
            modal.style.display = 'none'; // Скрываем модальное окно
        }
    </script>
</body>
</html>
