<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қатысу формасы</title>
    <style>
        body {
    font-family: 'Roboto', sans-serif;
    background-color: #d50032; /* Красный фон */
    color: #fff; /* Белый текст */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.container {
    background: #fff; /* Белый фон контейнера */
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    max-width: 500px;
    width: 100%;
    text-align: center;
    color: #373435; /* Темно-серый текст */
}

.logo {
    width: 100px;
    height: 50px;
    margin-bottom: 20px;
}

h2 {
    font-size: 25px;
    text-transform: uppercase;
    margin-bottom: 16px;
    color: #d50032; /* Красный заголовок */
}

.form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
    text-align: left;
}

.form-row {
    display: flex;
    gap: 10px;
}

.form-row .form-group {
    flex: 1;
}

label {
    font-size: 14px;
    display: block;
    margin-bottom: 8px;
    color: #373435; /* Темно-серый текст */
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d50032; /* Красная рамка */
    border-radius: 8px;
    background-color: #fff;
    color: #373435; /* Темно-серый текст */
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    background-color: #FEDD61; /* Желтый цвет кнопки */
    color: #373435; /* Темно-серый текст */
    font-size: 16px;
    font-weight: 500;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 16px;
}

button:hover {
    background-color: #e6c853; /* Темнее желтый при наведении */
}

.footer-text {
    font-size: 12px;
    margin-top: 16px;
    color: #373435; /* Темно-серый текст */
}
    </style>
</head>
<body>
    <div class="container">
        <img src="../images/image-removebg-preview.png" alt="Логотип" class="logo">
        <h2>Бақытты нөміріңізді алыңыз</h2>

        <form id="registrationForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Есіміңіз</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="number">Телефон номеріңіз</label>
                    <input type="tel" id="number" name="number" required>
                </div>
            </div>
            <div class="form-group">
                <label for="command">Команда аты</label>
                <input type="text" id="command" name="command" required>
            </div>
            <button type="submit">Тіркелу</button>
        </form>

        <p class="footer-text">Батырманы баса отырып, сіз өзіңіз жайлы ақпаратты өңдеуге рұқсат бересіз</p>
    </div>

    <script>
        // Обработка отправки формы
        document.getElementById('registrationForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Отменяем стандартную отправку формы

            // Собираем данные формы
            const formData = {
                name: document.getElementById('name').value,
                number: document.getElementById('number').value,
                command: document.getElementById('command').value,
            };

            try {
                // Отправляем данные на сервер
                const response = await fetch('/account/reg', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                // Обрабатываем ответ
                const result = await response.json();

                if (result.success) {
                    // Показываем модальное окно с номером
                    showModal(result.number);
                } else {
                    alert('Тіркеу сәтсіз аяқталды: ' + result.msg);
                }
            } catch (error) {
                console.error('Қате орын алды:', error);
                alert('Серверге қосылу мүмкін емес');
            }
        });

        // Функция для показа модального окна
        function showModal(number) {
            const modal = document.getElementById('successModal');
            const userNumber = document.getElementById('userNumber');
            userNumber.textContent = number; // Вставляем номер в модальное окно
            modal.style.display = 'flex'; // Показываем модальное окно
        }

        // Функция для закрытия модального окна
        function closeModal() {
            const modal = document.getElementById('successModal');
            modal.style.display = 'none'; // Скрываем модальное окно
        }
    </script>
</body>
</html>
